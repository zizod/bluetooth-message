<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BT Text">
  <title>Bluetooth Text - made by zaid</title>
  <link id="pwa-manifest" rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Bluetooth%20Text%22%2C%22short_name%22%3A%22BT%20Text%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ffffff%22%7D">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: monospace, sans-serif;
      font-size: 14px;
      background-color: #ffffff;
      color: #000000;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 100%;
      padding: 8px;
      gap: 6px;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #000000;
      padding-bottom: 4px;
      flex-wrap: wrap;
      gap: 4px;
    }
    #title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    #app-title {
      font-weight: bold;
      font-size: 15px;
    }
    #author-label {
      font-size: 12px;
      color: #333333;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      border-bottom: 1px solid #000000;
      padding-bottom: 6px;
    }
    button, select, input[type="text"] {
      font-family: monospace, sans-serif;
      font-size: 13px;
      color: #000000;
      background-color: #f0f0f0;
      border: 1px solid #000000;
      padding: 4px 8px;
      border-radius: 0;
      margin: 0;
    }
    button:active {
      background-color: #d0d0d0;
    }
    button:disabled {
      color: #777777;
      border-color: #777777;
      background-color: #f8f8f8;
    }
    input[type="text"] {
      background-color: #ffffff;
    }
    #name-input {
      width: 90px;
    }
    #status-bar {
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #000000;
      background-color: #fafafa;
      word-break: break-word;
    }
    #messages {
      flex: 1;
      border: 1px solid #000000;
      padding: 6px;
      overflow-y: auto;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .msg-row {
      word-break: break-word;
      line-height: 1.35;
    }
    .msg-time {
      color: #555555;
      font-size: 11px;
    }
    .msg-sender {
      font-weight: bold;
    }
    .msg-sys {
      color: #444444;
      font-style: italic;
    }
    #composer {
      display: flex;
      gap: 4px;
    }
    #msg-input {
      flex: 1;
      min-width: 0;
      padding: 6px;
    }
    #footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #222222;
      padding-top: 2px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title-group">
        <span id="app-title">Bluetooth Text</span>
        <span id="author-label">made by zaid</span>
      </div>
      <span id="bt-state">BLE: Disconnected</span>
    </div>

    <div id="controls">
      <label for="name-input">Name:</label>
      <input type="text" id="name-input" value="Phone1" maxlength="16" aria-label="Sender name">
      <select id="profile-select" aria-label="Bluetooth profile">
        <option value="nus">BLE UART (NUS)</option>
        <option value="ffe0">BLE HM-10 (FFE0)</option>
        <option value="any">BLE Any Device</option>
      </select>
      <button type="button" id="connect-btn">Scan &amp; Connect</button>
      <button type="button" id="disconnect-btn" disabled>Disconnect</button>
      <button type="button" id="clear-btn">Clear</button>
      <button type="button" id="install-btn" style="display:none;">Install App</button>
    </div>

    <div id="status-bar">Status: Ready</div>

    <div id="messages" role="log" aria-live="polite"></div>

    <form id="composer" autocomplete="off">
      <input type="text" id="msg-input" placeholder="Type message..." maxlength="500" aria-label="Message text">
      <button type="submit" id="send-btn">Send</button>
    </form>

    <div id="footer">
      <span>made by zaid</span>
      <span id="msg-count">0 messages</span>
    </div>
  </div>

  <script>
    (function () {
      var NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
      var NUS_TX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
      var NUS_RX_CHAR = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

      var FFE0_SERVICE = '0000ffe0-0000-1000-8000-00805f9b34fb';
      var FFE1_CHAR = '0000ffe1-0000-1000-8000-00805f9b34fb';

      var bleDevice = null;
      var bleServer = null;
      var txCharacteristic = null;
      var rxCharacteristic = null;
      var rxBuffer = '';
      var deferredInstallPrompt = null;
      var localChannel = null;

      var btStateEl = document.getElementById('bt-state');
      var statusBarEl = document.getElementById('status-bar');
      var messagesEl = document.getElementById('messages');
      var msgInputEl = document.getElementById('msg-input');
      var nameInputEl = document.getElementById('name-input');
      var profileSelectEl = document.getElementById('profile-select');
      var connectBtn = document.getElementById('connect-btn');
      var disconnectBtn = document.getElementById('disconnect-btn');
      var clearBtn = document.getElementById('clear-btn');
      var installBtn = document.getElementById('install-btn');
      var composerForm = document.getElementById('composer');
      var msgCountEl = document.getElementById('msg-count');

      var messageHistory = [];

      function loadState() {
        try {
          var savedName = localStorage.getItem('zaid_bt_name');
          if (savedName) {
            nameInputEl.value = savedName;
          }
          var savedMsgs = localStorage.getItem('zaid_bt_msgs');
          if (savedMsgs) {
            var parsed = JSON.parse(savedMsgs);
            if (Array.isArray(parsed)) {
              messageHistory = parsed;
            }
          }
        } catch (e) {
          messageHistory = [];
        }
        renderMessages();
      }

      function saveState() {
        try {
          localStorage.setItem('zaid_bt_name', nameInputEl.value.trim() || 'Phone1');
          localStorage.setItem('zaid_bt_msgs', JSON.stringify(messageHistory.slice(-100)));
        } catch (e) {
          // Ignore storage errors in restricted contexts
        }
      }

      function formatTime(ts) {
        var d = new Date(ts);
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        var ss = String(d.getSeconds()).padStart(2, '0');
        return hh + ':' + mm + ':' + ss;
      }

      function setStatus(text) {
        statusBarEl.textContent = 'Status: ' + text;
      }

      function renderMessages() {
        messagesEl.innerHTML = '';
        if (messageHistory.length === 0) {
          var emptyRow = document.createElement('div');
          emptyRow.className = 'msg-row msg-sys';
          emptyRow.textContent = 'No messages yet.';
          messagesEl.appendChild(emptyRow);
        } else {
          for (var i = 0; i < messageHistory.length; i++) {
            var item = messageHistory[i];
            var row = document.createElement('div');
            row.className = 'msg-row' + (item.system ? ' msg-sys' : '');

            var timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time';
            timeSpan.textContent = '[' + formatTime(item.ts) + '] ';
            row.appendChild(timeSpan);

            if (item.system) {
              var sysSpan = document.createElement('span');
              sysSpan.textContent = item.text;
              row.appendChild(sysSpan);
            } else {
              var senderSpan = document.createElement('span');
              senderSpan.className = 'msg-sender';
              senderSpan.textContent = item.sender + ': ';
              row.appendChild(senderSpan);

              var textSpan = document.createElement('span');
              textSpan.textContent = item.text;
              row.appendChild(textSpan);
            }
            messagesEl.appendChild(row);
          }
        }
        msgCountEl.textContent = messageHistory.length + (messageHistory.length === 1 ? ' message' : ' messages');
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addMessage(sender, text, isSystem) {
        messageHistory.push({
          ts: Date.now(),
          sender: sender,
          text: text,
          system: Boolean(isSystem)
        });
        saveState();
        renderMessages();
      }

      function updateConnectionUI(connected, deviceName) {
        if (connected) {
          btStateEl.textContent = 'BLE: Connected (' + (deviceName || 'Device') + ')';
          connectBtn.disabled = true;
          disconnectBtn.disabled = false;
        } else {
          btStateEl.textContent = 'BLE: Disconnected';
          connectBtn.disabled = false;
          disconnectBtn.disabled = true;
        }
      }

      function handleIncomingBytes(event) {
        var value = event.target.value;
        if (!value) return;
        var decoder = new TextDecoder('utf-8');
        var chunk = decoder.decode(value);
        rxBuffer += chunk;

        var lines = rxBuffer.split('\n');
        if (lines.length > 1) {
          for (var i = 0; i < lines.length - 1; i++) {
            processIncomingPayload(lines[i]);
          }
          rxBuffer = lines[lines.length - 1];
        } else if (rxBuffer.length >= 180) {
          processIncomingPayload(rxBuffer);
          rxBuffer = '';
        }
      }

      function processIncomingPayload(raw) {
        var trimmed = raw.trim();
        if (!trimmed) return;
        var sepIdx = trimmed.indexOf(':');
        if (sepIdx > 0 && sepIdx < 20) {
          var sender = trimmed.slice(0, sepIdx).trim();
          var body = trimmed.slice(sepIdx + 1).trim();
          addMessage(sender || 'Peer', body, false);
        } else {
          var peerName = (bleDevice && bleDevice.name) ? bleDevice.name : 'Peer';
          addMessage(peerName, trimmed, false);
        }
      }

      function onDeviceDisconnected() {
        txCharacteristic = null;
        rxCharacteristic = null;
        bleServer = null;
        updateConnectionUI(false);
        setStatus('Bluetooth device disconnected.');
        addMessage('', 'Disconnected from Bluetooth device.', true);
      }

      async function connectBluetooth() {
        if (!navigator.bluetooth) {
          setStatus('Web Bluetooth API unavailable in this browser/webview.');
          addMessage('', 'Web Bluetooth is not supported in this browser. Open in Chrome on Android/Desktop.', true);
          return;
        }

        try {
          setStatus('Requesting Bluetooth device...');
          var profile = profileSelectEl.value;
          var options;

          if (profile === 'nus') {
            options = {
              filters: [{ services: [NUS_SERVICE] }],
              optionalServices: [NUS_SERVICE, FFE0_SERVICE]
            };
          } else if (profile === 'ffe0') {
            options = {
              filters: [{ services: [FFE0_SERVICE] }],
              optionalServices: [FFE0_SERVICE, NUS_SERVICE]
            };
          } else {
            options = {
              acceptAllDevices: true,
              optionalServices: [NUS_SERVICE, FFE0_SERVICE, 'generic_access']
            };
          }

          bleDevice = await navigator.bluetooth.requestDevice(options);
          bleDevice.addEventListener('gattserverdisconnected', onDeviceDisconnected);

          setStatus('Connecting to GATT server...');
          bleServer = await bleDevice.gatt.connect();

          txCharacteristic = null;
          rxCharacteristic = null;

          var services = await bleServer.getPrimaryServices();
          for (var s = 0; s < services.length; s++) {
            var chars = await services[s].getCharacteristics();
            for (var c = 0; c < chars.length; c++) {
              var ch = chars[c];
              var uuid = ch.uuid.toLowerCase();
              if (uuid === NUS_TX_CHAR || uuid === FFE1_CHAR || ch.properties.write || ch.properties.writeWithoutResponse) {
                if (!txCharacteristic) txCharacteristic = ch;
              }
              if (uuid === NUS_RX_CHAR || uuid === FFE1_CHAR || ch.properties.notify || ch.properties.indicate) {
                if (!rxCharacteristic) rxCharacteristic = ch;
              }
            }
          }

          if (rxCharacteristic) {
            await rxCharacteristic.startNotifications();
            rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingBytes);
          }

          var devName = bleDevice.name || 'BLE Peer';
          updateConnectionUI(true, devName);
          setStatus('Connected to ' + devName);
          addMessage('', 'Connected to ' + devName, true);
        } catch (err) {
          updateConnectionUI(false);
          setStatus('Connection failed or cancelled: ' + (err && err.message ? err.message : String(err)));
        }
      }

      function disconnectBluetooth() {
        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
          bleDevice.gatt.disconnect();
        } else {
          onDeviceDisconnected();
        }
      }

      async function writeBlePayload(payloadStr) {
        if (!txCharacteristic) {
          throw new Error('No writable BLE characteristic found on connected device.');
        }
        var encoder = new TextEncoder();
        var bytes = encoder.encode(payloadStr + '\n');
        var chunkSize = 20;
        for (var offset = 0; offset < bytes.length; offset += chunkSize) {
          var slice = bytes.slice(offset, offset + chunkSize);
          if (txCharacteristic.properties.writeWithoutResponse && txCharacteristic.writeValueWithoutResponse) {
            await txCharacteristic.writeValueWithoutResponse(slice);
          } else {
            await txCharacteristic.writeValue(slice);
          }
        }
      }

      async function handleSend(e) {
        e.preventDefault();
        var text = msgInputEl.value.trim();
        if (!text) return;

        var sender = nameInputEl.value.trim() || 'Phone1';
        saveState();
        msgInputEl.value = '';

        if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected && txCharacteristic) {
          try {
            await writeBlePayload(sender + ': ' + text);
            addMessage(sender, text, false);
            setStatus('Sent over BLE.');
          } catch (err) {
            setStatus('BLE send error: ' + (err && err.message ? err.message : String(err)));
          }
        } else {
          addMessage(sender, text, false);
          if (localChannel) {
            try {
              localChannel.postMessage({ sender: sender, text: text });
            } catch (err) {
              // Ignore broadcast errors
            }
          }
          setStatus('Saved to log (BLE not connected).');
        }
      }

      function setupBroadcastFallback() {
        try {
          if (typeof BroadcastChannel !== 'undefined') {
            localChannel = new BroadcastChannel('zaid_bt_text_channel');
            localChannel.onmessage = function (ev) {
              if (ev && ev.data && ev.data.text) {
                addMessage(ev.data.sender || 'Peer', ev.data.text, false);
                setStatus('Message received.');
              }
            };
          }
        } catch (e) {
          localChannel = null;
        }
      }

      function setupPwa() {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredInstallPrompt = e;
          installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async function () {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          installBtn.style.display = 'none';
        });

        try {
          if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
            var swCode = [
              "self.addEventListener('install', function(e) { self.skipWaiting(); });",
              "self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });",
              "self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request).catch(function() { return caches.match(e.request); })); });"
            ].join('\n');
            var blob = new Blob([swCode], { type: 'application/javascript' });
            var swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(function () {});
          }
        } catch (e) {
          // Ignore service worker restrictions in sandboxed iframes
        }
      }

      connectBtn.addEventListener('click', connectBluetooth);
      disconnectBtn.addEventListener('click', disconnectBluetooth);
      clearBtn.addEventListener('click', function () {
        messageHistory = [];
        saveState();
        renderMessages();
        setStatus('Chat cleared.');
      });
      nameInputEl.addEventListener('change', saveState);
      composerForm.addEventListener('submit', handleSend);

      loadState();
      setupBroadcastFallback();
      setupPwa();
    })();
  </script>
</body>
</html>
